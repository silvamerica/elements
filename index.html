<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#000000" />
		<title>Water</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #000;
				overflow: hidden;
				touch-action: none;
				overscroll-behavior: none;
				-webkit-user-select: none;
				user-select: none;
			}
			#app {
				position: fixed;
				inset: 0;
			}
			#shelf {
				position: fixed;
				top: 12px;
				right: 12px;
				max-width: 40vw;
				font: 12px/1.5 ui-rounded, system-ui, sans-serif;
				color: rgba(255, 255, 255, 0.55);
				text-align: right;
				pointer-events: none;
			}
			#shelf .world {
				color: rgba(255, 255, 255, 0.8);
			}
			#shelf button {
				pointer-events: auto;
				background: none;
				border: 0;
				padding: 2px 0;
				font: inherit;
				color: inherit;
				cursor: pointer;
			}
			#shelf .list {
				max-height: 45vh;
				overflow-y: auto;
				pointer-events: auto;
				margin: 4px 0;
			}
			#shelf .reset {
				display: block;
				margin-left: auto;
				opacity: 0.35;
			}
			#shelf .reset:hover {
				opacity: 0.8;
			}
			#shelf .new {
				color: #fff;
				transition: color 2s;
			}
			#toast {
				position: fixed;
				bottom: 28px;
				left: 0;
				right: 0;
				text-align: center;
				font: 15px ui-rounded, system-ui, sans-serif;
				color: rgba(255, 255, 255, 0.85);
				opacity: 0;
				transition: opacity 0.6s;
				pointer-events: none;
			}
			#toast.show {
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<div id="shelf"></div>
		<div id="toast"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
