<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#000000" />
		<title>Elements</title>
		<style>
			/* One system: glass panels and pills, one accent, one font. */
			:root {
				--glass: rgba(16, 19, 26, 0.8);
				--line: rgba(255, 255, 255, 0.12);
				--line-strong: rgba(255, 255, 255, 0.28);
				--text: rgba(255, 255, 255, 0.92);
				--muted: rgba(255, 255, 255, 0.58);
				--faint: rgba(255, 255, 255, 0.36);
				--accent: #4fc3ff;
				--accent-soft: rgba(79, 195, 255, 0.16);
				--spark: #ffb347;
				--radius: 14px;
				--gap: 12px;
				--font: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #000;
				overflow: hidden;
				touch-action: none;
				overscroll-behavior: none;
				-webkit-user-select: none;
				user-select: none;
				font: 13px/1.4 var(--font);
				color: var(--text);
			}
			#app {
				position: fixed;
				inset: 0;
			}
			[hidden] {
				display: none !important;
			}
			button {
				font: inherit;
				color: inherit;
				background: none;
				border: 0;
				padding: 0;
				cursor: pointer;
			}
			.panel,
			.pill {
				background: var(--glass);
				border: 1px solid var(--line);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
			}
			.panel {
				border-radius: var(--radius);
			}
			.pill {
				border-radius: 999px;
				padding: 6px 12px;
				display: inline-flex;
				align-items: center;
				gap: 8px;
				white-space: nowrap;
			}
			.pill.accent,
			button.pill.accent {
				border-color: var(--accent);
				background: var(--accent-soft);
				color: #dff4ff;
			}
			.label {
				font-size: 11px;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--faint);
			}
			.chip {
				border-radius: 999px;
				padding: 1px 7px;
				font-size: 11px;
				font-weight: 600;
			}

			/* Top: world card, discoveries, assembling pill. */
			#hud {
				position: fixed;
				top: calc(var(--gap) + env(safe-area-inset-top));
				left: var(--gap);
				right: var(--gap);
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: var(--gap);
				pointer-events: none;
			}
			#hud > * {
				pointer-events: auto;
			}
			#world {
				padding: 8px 12px;
				white-space: nowrap;
			}
			#world b {
				font-weight: 600;
			}
			#world .seed {
				color: var(--faint);
				margin-left: 6px;
			}
			#found {
				min-width: 260px;
				max-width: 340px;
				padding: 10px 12px;
			}
			#found .counts {
				display: flex;
				gap: 14px;
				margin-top: 2px;
				text-align: left;
				width: 100%;
			}
			#found .counts b {
				font-size: 15px;
				font-weight: 600;
			}
			#found .counts > span {
				white-space: nowrap;
			}
			#found .counts > span > span {
				color: var(--faint);
				font-size: 11px;
				margin-left: 3px;
			}
			#tray .sect .label {
				display: block;
			}
			#found .list {
				margin-top: 8px;
				max-height: 45vh;
				overflow-y: auto;
				scrollbar-width: thin;
			}
			#found .row {
				display: flex;
				justify-content: space-between;
				gap: 8px;
				width: 100%;
				padding: 5px 8px;
				border-radius: 8px;
				color: var(--muted);
				text-align: left;
			}
			#found .row:hover {
				background: var(--accent-soft);
				color: var(--text);
			}
			#found .row.new {
				color: #fff;
			}
			#found .row .build {
				color: var(--accent);
				font-size: 11px;
			}
			#found .foot {
				margin-top: 8px;
				padding-top: 8px;
				border-top: 1px solid var(--line);
				display: flex;
				justify-content: space-between;
				color: var(--muted);
			}
			#armed {
				position: fixed;
				top: calc(var(--gap) + env(safe-area-inset-top));
				left: 50%;
				transform: translateX(-50%);
			}

			#armed .dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 8px var(--accent);
			}
			#armed .stop {
				border: 1px solid var(--line-strong);
				border-radius: 999px;
				padding: 2px 10px;
				color: var(--muted);
			}
			#armed .stop:hover,
			#found .foot button:hover {
				color: var(--text);
			}
			#tray .row.wrap {
				flex-wrap: wrap;
				overflow-x: visible;
			}
			#tray .row.wrap .entry {
				display: block;
				flex: 0 1 auto;
				white-space: normal;
				border-radius: 12px;
			}
			#tray .row.wrap .entry > span {
				margin-left: 6px;
			}
			#tray .entry .result {
				color: var(--faint);
			}
			#tray .entry.known .result {
				color: var(--accent);
			}

			/* Bottom: message pill stacked on the tray, so neither hides the other. */
			#bottom {
				position: fixed;
				left: var(--gap);
				right: var(--gap);
				bottom: calc(var(--gap) + env(safe-area-inset-bottom));
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				pointer-events: none;
			}
			#toast {
				opacity: 0;
				transition: opacity 0.4s;
			}
			#toast.show {
				opacity: 1;
			}
			#tray {
				align-self: stretch;
				padding: 10px 12px;
				pointer-events: auto;
			}
			#tray .head {
				display: flex;
				align-items: center;
				gap: 10px;
				flex-wrap: wrap;
			}
			#tray .head b {
				font-size: 15px;
				font-weight: 600;
			}
			#tray .head .sub {
				color: var(--muted);
			}
			#tray .head .pill {
				margin-left: auto;
				padding: 4px 12px;
			}
			#tray .sect {
				margin-top: 8px;
			}
			#tray .row {
				display: flex;
				gap: 8px;
				overflow-x: auto;
				margin-top: 4px;
				scrollbar-width: none;
			}
			#tray .entry {
				flex: none;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 5px 10px;
				border-radius: 999px;
				border: 1px solid var(--line);
				background: rgba(255, 255, 255, 0.04);
				color: var(--muted);
				white-space: nowrap;
			}
			#tray .entry.known {
				color: var(--text);
				border-color: var(--line-strong);
			}
			#tray .entry.picked {
				color: var(--text);
				border-color: var(--accent);
				background: var(--accent-soft);
				box-shadow: 0 0 10px rgba(79, 195, 255, 0.35);
			}
			#tray .entry .flick {
				color: var(--spark);
			}
			#tray .chip.part {
				border: 1px solid var(--accent);
				color: var(--accent);
				background: transparent;
			}
			#tray .more {
				flex: none;
				align-self: center;
				color: var(--faint);
				white-space: nowrap;
			}

			/* Another tab has this world. */
			#elsewhere {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: rgba(0, 0, 0, 0.6);
			}
			#elsewhere .panel {
				padding: 18px 20px;
				max-width: 320px;
				text-align: center;
				display: grid;
				gap: 12px;
			}

			@media (max-width: 600px) {
				#found {
					width: auto;
					padding: 8px 12px;
				}
				#found .label,
				#found .counts .structures {
					display: none;
				}
				#found .counts b {
					font-size: 13px;
				}
				#world {
					flex: none;
				}
				#found {
					min-width: 0;
				}
				#found .counts .reactions {
					display: none;
				}
				#armed {
					top: calc(64px + env(safe-area-inset-top));
				}
				/* Keep the tray to a strip: reactions scroll sideways like the
				   other rows instead of stacking, and the whole panel never
				   covers more than a third of the screen. */
				#tray {
					max-height: 34vh;
					overflow-y: auto;
					scrollbar-width: none;
				}
				#tray .row.wrap {
					flex-wrap: nowrap;
					overflow-x: auto;
				}
				#tray .row.wrap .entry {
					display: inline-flex;
					flex: none;
					white-space: nowrap;
					border-radius: 999px;
				}
				#tray .row.wrap .entry > span {
					margin-left: 0;
				}
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<div id="hud">
			<div id="world" class="panel"></div>
			<div id="found" class="panel"></div>
		</div>
		<div id="armed" class="pill" hidden></div>
		<div id="bottom">
			<div id="toast" class="pill"></div>
			<div id="tray" class="panel" hidden></div>
		</div>
		<div id="elsewhere" hidden></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
